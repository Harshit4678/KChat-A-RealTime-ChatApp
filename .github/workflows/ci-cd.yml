name: Docker CI/CD

on:
  push:
    branches: [KLikChat]
  pull_request:
    branches: [KLikChat]

jobs:
  build-and-run:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create backend .env
        run: |
          echo "MONGODB_URI=${{ secrets.MONGO_URI }}" > backend/.env
          echo "PORT=3000" >> backend/.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> backend/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> backend/.env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> backend/.env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> backend/.env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> backend/.env
          echo "NODE_ENV=development" >> backend/.env
          echo "SMTP_EMAIL=${{ secrets.SMTP_EMAIL }}" >> backend/.env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> backend/.env

      - name: Docker Compose Build & Run
        run: |
          docker compose up -d --build
          docker compose ps

      - name: Shutdown
        run: docker compose down

      - name: Cleanup .env
        run: rm -f backend/.env
