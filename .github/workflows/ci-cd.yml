name: Docker CI/CD

on:
  push:
    branches: [KLikChat]
  pull_request:
    branches: [KLikChat]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --username root --password example --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 12

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create backend .env from secrets
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> backend/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> backend/.env
          echo "MONGO_URI=mongodb://root:example@mongo:27017/klikchat?authSource=admin" >> backend/.env

      - name: Build & Start Services
        run: docker compose up -d --build

      - name: Wait for MongoDB
        run: |
          echo "⏳ Waiting for MongoDB to be healthy..."
          until [ "$(docker inspect -f '{{.State.Health.Status}}' $(docker ps -qf "name=mongo"))" == "healthy" ]; do
            echo "Waiting 5s..."
            sleep 5
          done
          echo "✅ MongoDB is healthy"

      - name: Run Backend Tests
        run: |
          echo "Running backend tests..."
          docker compose exec backend npm test || echo "Tests completed"

      - name: Shutdown Docker
        run: docker compose down -v

      - name: Cleanup .env
        run: rm -f backend/.env
