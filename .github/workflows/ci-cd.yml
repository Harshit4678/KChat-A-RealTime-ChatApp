name: Docker CI/CD

on:
  push:
    branches: [KLikChat]
  pull_request:
    branches: [KLikChat]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --eval 'db.adminCommand(\"ping\")'" 
          --health-interval 5s 
          --health-timeout 5s 
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and run services with environment variables directly from secrets
      - name: Docker Compose Build & Run
        run: |
          docker compose up -d --build

      # Wait for backend to be ready (example: checking port 3000)
      - name: Wait for backend
        run: |
          echo "⏳ Waiting for backend to be ready..."
          for i in {1..20}; do
            if curl -s http://localhost:3000/api/health > /dev/null; then
              echo "Backend is up!"
              break
            fi
            echo "Waiting 5s..."
            sleep 5
          done

      # Run backend tests
      - name: Run Tests
        run: |
          docker compose exec backend npm test

      # Shutdown and cleanup Docker
      - name: Shutdown Docker
        run: docker compose down --rmi all -v
