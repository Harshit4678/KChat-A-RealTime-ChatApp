name: Docker CI/CD

on:
  push:
    branches: [KLikChat]
  pull_request:
    branches: [KLikChat]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and run containers
        run: |
          docker-compose up -d --build
          sleep 20
          docker-compose ps
          docker-compose down
