name: Docker CI/CD

on:
  push:
    branches: [KLikChat]
  pull_request:
    branches: [KLikChat]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate temporary .env file from GitHub Secrets
      - name: Create backend .env
        run: |
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> backend/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> backend/.env
          echo "MONGO_URI=${{ secrets.MONGO_URI }}" >> backend/.env

      - name: Docker Compose Build & Run
        run: |
          docker compose up -d --build
          echo "⏳ Waiting for services to be ready..."
          sleep 20
          docker compose ps

      - name: Run Tests (optional)
        run: |
          echo "✅ Add your tests here"
          # docker exec <container-name> npm test

      - name: Shutdown Docker
        run: docker compose down

      # Optional: Remove the temporary .env file after CI
      - name: Cleanup .env
        run: rm -f backend/.env
