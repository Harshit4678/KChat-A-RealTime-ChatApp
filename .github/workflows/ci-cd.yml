name: Docker CI/CD

on:
  push:
    branches: [KLikChat]
  pull_request:
    branches: [KLikChat]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    services:
      mongo:
        image: mongo:6.0
        env:
          MONGO_INITDB_ROOT_USERNAME: root
          MONGO_INITDB_ROOT_PASSWORD: example
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongo --username root --password example --authenticationDatabase admin --eval 'db.adminCommand(\"ping\")'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Generate temporary .env from GitHub Secrets (backend)
      - name: Create backend .env
        run: |
          echo "MONGODB_URI=${{ secrets.MONGO_URI }}" >> backend/.env
          echo "PORT=${{ secrets.PORT }}" >> backend/.env
          echo "GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}" >> backend/.env
          echo "GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}" >> backend/.env
          echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" >> backend/.env
          echo "FRONTEND_URL=${{ secrets.FRONTEND_URL }}" >> backend/.env
          echo "CLOUDINARY_CLOUD_NAME=${{ secrets.CLOUDINARY_CLOUD_NAME }}" >> backend/.env
          echo "CLOUDINARY_API_KEY=${{ secrets.CLOUDINARY_API_KEY }}" >> backend/.env
          echo "CLOUDINARY_API_SECRET=${{ secrets.CLOUDINARY_API_SECRET }}" >> backend/.env
          echo "NODE_ENV=${{ secrets.NODE_ENV }}" >> backend/.env
          echo "SMTP_EMAIL=${{ secrets.SMTP_EMAIL }}" >> backend/.env
          echo "SMTP_PASS=${{ secrets.SMTP_PASS }}" >> backend/.env

      - name: Docker Compose Build & Run
        run: |
          docker compose up -d --build
          echo "⏳ Waiting for services to be ready..."
          sleep 30
          docker compose ps

      - name: Run Tests (optional)
        run: |
          echo "✅ Add your tests here"
          # docker exec <backend-container-name> npm test

      - name: Shutdown Docker
        run: docker compose down

      - name: Cleanup .env
        run: rm -f backend/.env
